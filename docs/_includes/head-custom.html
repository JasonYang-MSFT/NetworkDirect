<!-- Render ```mermaid fenced code blocks on GitHub Pages.
     Jekyll/rouge emits them as <div class="language-mermaid">…<code>…</code></div>;
     we rewrite each block to <pre class="mermaid"> before initializing Mermaid. -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  const init = () => {
    document
      .querySelectorAll("div.language-mermaid, pre > code.language-mermaid")
      .forEach((el) => {
        const code = el.tagName === "CODE" ? el : el.querySelector("code");
        if (!code) return;
        const host = el.tagName === "CODE" ? el.parentElement : el;
        const pre = document.createElement("pre");
        pre.className = "mermaid";
        pre.textContent = code.textContent;
        host.replaceWith(pre);
      });
    mermaid.initialize({ startOnLoad: true, securityLevel: "loose" });
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
</script>
